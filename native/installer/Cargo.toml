[package]
name = "goat-native-installer"
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Native no-Node installer and launcher for GOAT"
publish = false

[dependencies]
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
serde_json = "=1.0.140"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
