sonar.projectKey=Kyle333-glitch_goatcli

# Generated artifacts are not hand-maintained code.
sonar.exclusions=src/privacy/release-policy.generated.ts,src/privacy/release-policy-signature.generated.ts

# Privacy architecture script is intentionally a broad static-analysis tool.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8

# Cognitive complexity in security-critical credential/IPC code is accepted
# because the code was reviewed and tested; refactoring would risk regressions.
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/src/auth/credentials.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/src/privacy/launcher-ipc-v2.ts
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/src/engine/validate.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.e4.resourceKey=**/scripts/check-privacy-architecture.mjs

# Node IPC transport uses nested event handlers by design.
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.e5.resourceKey=**/src/privacy/node-transport.ts

# Regular expressions in browser path parsing and the privacy architecture
# checker were simplified where possible; remaining warnings are false positives.
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S5852
sonar.issue.ignore.multicriteria.e6.resourceKey=**/src/auth/browser.ts
sonar.issue.ignore.multicriteria.e7.ruleKey=javascript:S5852
sonar.issue.ignore.multicriteria.e7.resourceKey=**/scripts/check-privacy-architecture.mjs

# The check script is a build-time guard, not runtime code.
sonar.issue.ignore.multicriteria.e8.ruleKey=javascript:S2004
sonar.issue.ignore.multicriteria.e8.resourceKey=**/scripts/check-privacy-architecture.mjs
