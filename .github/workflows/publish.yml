name: publish

# Release gating:
# - Tag pushes verify that the tag version matches package.json before
#   publishing (see the "Verify tag matches package version" step).
# - workflow_dispatch has no tag, so it publishes whatever version
#   package.json declares. npm rejects an already-published version, and
#   scripts/verify-package.mjs validates the version is semver (it is not
#   pinned to a specific release), so a manual dispatch requires write access
#   and cannot silently republish or ship a malformed version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required to mint the Sigstore OIDC token used for npm provenance
  # (`publishConfig.provenance: true` in package.json).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$pkg_version" ]]; then
            echo "Tag version (${tag_version}) does not match package.json version (${pkg_version})" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check
        timeout-minutes: 5

      - name: Typecheck
        run: npm run typecheck
        timeout-minutes: 5

      - name: Verify package artifact
        run: npm run verify:package
        timeout-minutes: 10

      # `--ignore-scripts` skips the `prepublishOnly` lifecycle, whose full
      # `npm test` run is platform-specific (Windows/macOS) and is already
      # enforced by test.yml on the tagged commit. The platform-independent
      # format/typecheck/package-artifact gates run explicitly above.
      - name: Publish to npm
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
