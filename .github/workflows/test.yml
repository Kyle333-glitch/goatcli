name: test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }} / ${{ matrix.arch }} / shard ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            test_shard: "1/1"
            test_excludes: ""
          # The locked-image test is covered by the Windows x64 job above.
          # Windows ARM can hang while terminating that native fixture after
          # the assertion, so keep the remaining ARM suite independently
          # bounded and do not run that unsupported file-lock scenario there.
          - os: windows-11-arm
            arch: arm64
            test_shard: "1/2"
            test_excludes: "!src/update/locked-exe.native.test.ts"
          - os: windows-11-arm
            arch: arm64
            test_shard: "2/2"
            test_excludes: "!src/update/locked-exe.native.test.ts"
          - os: macos-latest
            arch: arm64
            test_shard: "1/1"
            test_excludes: ""
          - os: macos-15-intel
            arch: x64
            test_shard: "1/1"
            test_excludes: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Print runner platform and architecture
        run: |
          node -e "console.log('process.platform=' + process.platform); console.log('process.arch=' + process.arch);"

      - name: Install reproducible native tooling (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mingwPkg = "mingw"
          choco list $mingwPkg --exact --limit-output | Out-Null
          choco install $mingwPkg --version 13.2.0 --no-progress --yes

      - name: Add MinGW to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin",
            "C:\tools\mingw64\bin"
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Add-Content -Path $env:GITHUB_PATH -Value $candidate
              Write-Host "Added MinGW bin to PATH: $candidate"
              break
            }
          }

      - name: Verify C compiler
        shell: bash
        run: |
          if command -v gcc >/dev/null 2>&1; then cc=gcc; elif command -v cc >/dev/null 2>&1; then cc=cc; else
            echo "Required C compiler not found on PATH. Native fixture engine health test will be skipped, reducing coverage."
            exit 1
          fi
          "$cc" --version

      - name: Verify code-signing tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($signtool) { & signtool.exe /? | Select-Object -First 3 }
          else { Write-Host "signtool.exe not on PATH; Authenticode tests will be environment-gated." }

      - name: Verify code-signing tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if command -v codesign >/dev/null 2>&1; then echo "codesign available"; else echo "codesign not on PATH; macOS signing tests will be environment-gated."; fi
          if command -v spctl >/dev/null 2>&1; then echo "spctl available"; else echo "spctl not on PATH; Gatekeeper tests will be environment-gated."; fi

      - name: Check formatting
        run: npm run format:check
        timeout-minutes: 5

      - name: Typecheck
        run: npm run typecheck
        timeout-minutes: 5

      - name: Run test shard (${{ matrix.test_shard }})
        shell: bash
        env:
          TEST_EXCLUDES: ${{ matrix.test_excludes }}
        run: |
          set -o pipefail
          test_args=("src/**/*.test.ts" "test/**/*.test.ts")
          if [[ -n "$TEST_EXCLUDES" ]]; then
            test_args+=("$TEST_EXCLUDES")
          fi
          npm run test:ci -- --test-shard="${{ matrix.test_shard }}" "${test_args[@]}" --test-reporter=tap | tee test-output.log
        timeout-minutes: 20

      - name: Check for unexpectedly skipped native tests
        shell: pwsh
        run: |
          $skipCount = (Get-Content test-output.log | Select-String -Pattern "# SKIP" -AllMatches).Count
          if ($skipCount -gt 0) {
            Write-Error "Tests skipped: $skipCount"
          }

      - name: Run privacy tests
        run: npm run test:privacy
        timeout-minutes: 10

      - name: Run lint and privacy architecture check
        run: npm run lint
        timeout-minutes: 5

      - name: Verify package contents
        run: npm run verify:package
        timeout-minutes: 10

      - name: Cross-repository test (if configured)
        run: npm run test:cross-repo
        timeout-minutes: 15
        continue-on-error: true
