name: test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      engine_sha:
        description: Exact 40-character goat-engine commit SHA
        required: true
        type: string
      control_plane_sha:
        description: Exact 40-character goat-control-plane commit SHA
        required: true
        type: string
      platforms:
        description: "Runner platforms to execute (non-Windows only when 'all')"
        type: choice
        options:
          - windows
          - all
        default: windows

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.set.outputs.verify }}
      cross_repo: ${{ steps.set.outputs.cross_repo }}
    steps:
      - name: Resolve runner platforms
        id: set
        run: |
          # Windows ARM can hang while terminating that native file-lock
          # fixture after the assertion, so that scenario is excluded there.
          windows='{"os":"windows-latest","arch":"x64","node":"24.16.0","rust_target":"x86_64-pc-windows-msvc","native_package":"goatcli-windows-spawn-win32-x64-msvc","native_package_dir":"win32-x64-msvc","test_shard":"1/1","test_excludes":""},{"os":"windows-latest","arch":"x64","node":"22.18.0","rust_target":"x86_64-pc-windows-msvc","native_package":"goatcli-windows-spawn-win32-x64-msvc","native_package_dir":"win32-x64-msvc","test_shard":"1/1","test_excludes":""},{"os":"windows-11-arm","arch":"arm64","node":"24.16.0","rust_target":"aarch64-pc-windows-msvc","native_package":"goatcli-windows-spawn-win32-arm64-msvc","native_package_dir":"win32-arm64-msvc","test_shard":"1/2","test_excludes":"src/update/locked-exe.native.test.ts"},{"os":"windows-11-arm","arch":"arm64","node":"24.16.0","rust_target":"aarch64-pc-windows-msvc","native_package":"goatcli-windows-spawn-win32-arm64-msvc","native_package_dir":"win32-arm64-msvc","test_shard":"2/2","test_excludes":"src/update/locked-exe.native.test.ts"},{"os":"windows-11-arm","arch":"arm64","node":"22.18.0","rust_target":"aarch64-pc-windows-msvc","native_package":"goatcli-windows-spawn-win32-arm64-msvc","native_package_dir":"win32-arm64-msvc","test_shard":"1/2","test_excludes":"src/update/locked-exe.native.test.ts"},{"os":"windows-11-arm","arch":"arm64","node":"22.18.0","rust_target":"aarch64-pc-windows-msvc","native_package":"goatcli-windows-spawn-win32-arm64-msvc","native_package_dir":"win32-arm64-msvc","test_shard":"2/2","test_excludes":"src/update/locked-exe.native.test.ts"}'
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.platforms }}" = "all" ]; then
            extra=',{"os":"macos-latest","arch":"arm64","node":"24.16.0","test_shard":"1/1","test_excludes":""},{"os":"macos-15-intel","arch":"x64","node":"24.16.0","test_shard":"1/1","test_excludes":""}'
            cross_repo='{"os":["windows-latest","macos-latest"]}'
          else
            extra=''
            cross_repo='{"os":["windows-latest"]}'
          fi
          {
            echo "verify={\"include\":[${windows}${extra}]}"
            echo "cross_repo=$cross_repo"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: matrix
    name: verify (${{ matrix.os }} / ${{ matrix.arch }} / node ${{ matrix.node }} / shard ${{ matrix.test_shard }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.verify) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "${{ matrix.node }}"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Bun for native privacy IPC (Windows)
        if: runner.os == 'Windows'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Setup pinned Rust toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt --target "$env:RUST_TARGET"
          rustup default 1.88.0
          rustc --version --verbose
          cargo --version

      - name: Install dependencies
        # --force only permits both CPU-specific source workspaces to coexist;
        # their published os/cpu metadata and artifact checks remain strict.
        run: npm ci --ignore-scripts --force

      - name: Print runner platform and architecture
        run: |
          node -e "console.log('process.platform=' + process.platform); console.log('process.arch=' + process.arch);"

      - name: Install reproducible native tooling (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mingwPkg = "mingw"
          choco list $mingwPkg --exact --limit-output | Out-Null
          choco install $mingwPkg --version 13.2.0 --no-progress --yes

      - name: Add MinGW to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin",
            "C:\tools\mingw64\bin"
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Add-Content -Path $env:GITHUB_PATH -Value $candidate
              Write-Host "Added MinGW bin to PATH: $candidate"
              break
            }
          }

      - name: Verify C compiler
        shell: bash
        run: |
          if command -v gcc >/dev/null 2>&1; then cc=gcc; elif command -v cc >/dev/null 2>&1; then cc=cc; else
            echo "Required C compiler not found on PATH. Native fixture engine health test will be skipped, reducing coverage."
            exit 1
          fi
          "$cc" --version

      - name: Verify code-signing tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($signtool) { & signtool.exe /? | Select-Object -First 3 }
          else { Write-Host "signtool.exe not on PATH; Authenticode tests will be environment-gated." }

      - name: Verify code-signing tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if command -v codesign >/dev/null 2>&1; then echo "codesign available"; else echo "codesign not on PATH; macOS signing tests will be environment-gated."; fi
          if command -v spctl >/dev/null 2>&1; then echo "spctl available"; else echo "spctl not on PATH; Gatekeeper tests will be environment-gated."; fi

      - name: Check and test native Windows spawner
        if: runner.os == 'Windows'
        run: npm run native:test
        timeout-minutes: 15

      - name: Build native Windows spawner
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          NATIVE_PACKAGE_DIR: ${{ matrix.native_package_dir }}
        run: |
          npm run native:build -- --release --target "$RUST_TARGET" --output-dir "./native/windows-spawn/npm/$NATIVE_PACKAGE_DIR"
        timeout-minutes: 15

      - name: Verify native npm artifacts
        if: runner.os == 'Windows'
        env:
          NATIVE_PACKAGE: ${{ matrix.native_package }}
        run: npm run verify:windows-spawn-packages -- --native-package "$NATIVE_PACKAGE"
        timeout-minutes: 10

      - name: Check formatting
        run: npm run format:check
        timeout-minutes: 5

      - name: Typecheck
        run: npm run typecheck
        timeout-minutes: 5

      - name: Run v0.4.1 Windows/macOS launcher E2E
        run: npm run test:platform-e2e
        timeout-minutes: 10

      - name: Run v0.4.1 integrity and recovery coverage
        run: npm run test:platform-integrity
        timeout-minutes: 15

      - name: Run test shard (${{ matrix.test_shard }})
        shell: bash
        env:
          TEST_EXCLUDES: ${{ matrix.test_excludes }}
          TEST_SHARD: ${{ matrix.test_shard }}
        run: |
          set -o pipefail
          if [[ -n "$TEST_EXCLUDES" ]]; then
            test_args=()
            while IFS= read -r test_file; do
              test_args+=("$test_file")
            done < <(find src test -type f -name '*.test.ts' ! -path "$TEST_EXCLUDES" -print | sort)
          else
            test_args=("src/**/*.test.ts" "test/**/*.test.ts")
          fi
          if (( ${#test_args[@]} == 0 )); then
            echo "No test files selected" >&2
            exit 1
          fi
          npm run test:ci -- --test-shard="$TEST_SHARD" "${test_args[@]}" --test-reporter=tap | tee test-output.log
        timeout-minutes: 20

      - name: Check for unexpectedly skipped native tests
        shell: pwsh
        env:
          RUNNER_FAMILY: ${{ runner.os }}
        run: |
          $allowedReasons = if ($env:RUNNER_FAMILY -eq "Windows") {
            @("macOS codesign test runs only on macOS")
          } else {
            @(
              "Authenticode test runs only on Windows",
              "locked-executable test runs only on Windows",
              "taskkill command failure is Windows-specific",
              "native Windows privacy spawn runs only on Windows"
            )
          }
          $unexpected = @()
          $skipLines = @(Get-Content test-output.log | Select-String -SimpleMatch "# SKIP")
          foreach ($skipLine in $skipLines) {
            $reason = ($skipLine.Line -split "# SKIP", 2)[1].Trim()
            if ($reason -notin $allowedReasons) {
              $unexpected += $skipLine.Line
            }
          }
          if ($unexpected.Count -gt 0) {
            $unexpected | ForEach-Object { Write-Host $_ }
            Write-Error "Unexpected native test skips: $($unexpected.Count)"
          }
          Write-Host "Expected platform-inapplicable skips: $($skipLines.Count - $unexpected.Count)"

      - name: Run privacy tests
        run: npm run test:privacy
        timeout-minutes: 10

      - name: Run lint and privacy architecture check
        run: npm run lint
        timeout-minutes: 5

      - name: Verify actual package artifact
        if: ${{ matrix.test_shard == '1/1' || matrix.test_shard == '1/2' }}
        shell: bash
        run: |
          npm run verify:package -- --report "$RUNNER_TEMP/goatcli-package-verification.json"
        timeout-minutes: 10

      - name: Upload package artifact-inspection report
        if: ${{ always() && (matrix.test_shard == '1/1' || matrix.test_shard == '1/2') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goatcli-package-verification-${{ runner.os }}-${{ matrix.arch }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/goatcli-package-verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify clean checkout after build and tests
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "$status"
            echo "Build or tests modified the clean checkout" >&2
            exit 1
          fi

  v041-cross-repo:
    needs: matrix
    name: v0.4.1 immutable mocked cross-repo (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.cross_repo) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate immutable cross-repository refs
        shell: bash
        env:
          ENGINE_SHA: ${{ inputs.engine_sha }}
          CONTROL_PLANE_SHA: ${{ inputs.control_plane_sha }}
        run: |
          for name in ENGINE_SHA CONTROL_PLANE_SHA; do
            value="${!name}"
            if [[ ! "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$name must be an exact 40-character commit SHA" >&2
              exit 1
            fi
          done

      - name: Checkout goatcli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: goatcli
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout goat-engine v0.4.1 worktree
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Kyle333-glitch/goat-engine
          path: goat-engine
          ref: ${{ inputs.engine_sha }}
          persist-credentials: false
          # Required because goat-engine is private.
          token: ${{ secrets.GOAT_REPO_READ_TOKEN }}

      - name: Checkout goat-control-plane v0.4.1 worktree
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Kyle333-glitch/goat-control-plane
          path: goat-control-plane
          ref: ${{ inputs.control_plane_sha }}
          persist-credentials: false
          # Required because goat-control-plane is private.
          token: ${{ secrets.GOAT_REPO_READ_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
          cache: "npm"
          cache-dependency-path: goatcli/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Setup pinned Rust toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc
          rustup default 1.88.0
          rustc --version --verbose

      - name: Install goatcli dependencies
        working-directory: goatcli
        # --force only permits both CPU-specific source workspaces to coexist;
        # their published os/cpu metadata and artifact checks remain strict.
        run: npm ci --ignore-scripts --force

      - name: Install goat-engine dependencies
        working-directory: goat-engine
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install goat-control-plane dependencies
        working-directory: goat-control-plane
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build and verify native Windows privacy spawner
        if: runner.os == 'Windows'
        working-directory: goatcli
        shell: bash
        run: |
          npm run native:test
          npm run native:build -- --release --target x86_64-pc-windows-msvc --output-dir ./native/windows-spawn/npm/win32-x64-msvc
          npm run verify:windows-spawn-packages -- --native-package goatcli-windows-spawn-win32-x64-msvc
        timeout-minutes: 20

      - name: Print runner platform and architecture
        run: node -e "console.log('process.platform=' + process.platform); console.log('process.arch=' + process.arch);"

      - name: Run v0.4.1 mocked cross-repository coverage
        working-directory: goatcli
        env:
          GOAT_ENGINE_ROOT: ${{ github.workspace }}/goat-engine/packages/opencode
          GOAT_CONTROL_PLANE_ROOT: ${{ github.workspace }}/goat-control-plane
        run: npm run test:cross-repo-v041
        timeout-minutes: 30

      - name: Verify immutable checkouts remain clean
        shell: bash
        run: |
          for repository in goatcli goat-engine goat-control-plane; do
            git -C "$repository" diff --exit-code
            git -C "$repository" diff --cached --exit-code
            status="$(git -C "$repository" status --porcelain --untracked-files=all)"
            if [[ -n "$status" ]]; then
              echo "$repository:"
              echo "$status"
              echo "Cross-repository tests modified an immutable checkout" >&2
              exit 1
            fi
          done
